<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Teller Access — First Community Bank</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-start:    #0b2b44;
      --bg-end:      #123e6a;
      --card-bg:     #ffffff;
      --text-dark:   #0f172a;
      --text-muted:  #475569;
      --text-faint:  #94a3b8;

      --brand:       #2c7da0;
      --brand-dark:  #1f5f7c;
      --brand-lt:    #e8f4fa;
      --brand-pale:  #b8d9ea;

      --success:     #127a4b;
      --success-dk:  #0e5d39;
      --success-lt:  #ecfdf3;
      --success-pale:#c7f0d8;

      --danger:      #c7362b;
      --danger-lt:   #fff1f1;
      --danger-pale: #ffd4d4;

      --border:      #dbe4ee;
      --border-lt:   #eef2f7;
      --surface:     #f8fafc;

      --shadow-md: 0 20px 48px rgba(0,0,0,.22), 0 4px 12px rgba(0,0,0,.1);

      --r-md:   12px;
      --r-lg:   18px;
      --r-xl:   24px;
      --r-pill: 100px;
    }

    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'DM Sans', sans-serif;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      color: #fff;
      background:
        radial-gradient(circle at top right, rgba(255,255,255,.07), transparent 35%),
        linear-gradient(145deg, var(--bg-start) 0%, var(--bg-end) 100%);
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    .shell {
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
      animation: rise .45s ease-out;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Header ── */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 1.75rem;
      text-align: center;
    }

    .logo-mark {
      width: 50px; height: 50px;
      border-radius: 50%;
      background: var(--brand);
      display: grid;
      place-items: center;
      margin-bottom: 4px;
    }

    .logo-mark svg {
      width: 22px; height: 22px;
      fill: none; stroke: #fff;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }

    .bank-name {
      font-family: 'Playfair Display', serif;
      font-size: 17px; font-weight: 500;
      color: #fff; letter-spacing: .3px;
    }

    .bank-sub {
      font-size: 12px;
      color: rgba(255,255,255,.5);
      font-weight: 300;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      padding: 8px 16px;
      border-radius: var(--r-pill);
      font-size: 12.5px; font-weight: 400;
      color: rgba(255,255,255,.75);
      text-decoration: none;
      border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.08);
      transition: background .18s, color .18s;
    }

    .back-link:hover { background: rgba(255,255,255,.15); color: #fff; }

    .back-link svg {
      width: 13px; height: 13px;
      stroke: currentColor; fill: none;
      stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
    }

    /* ── Card ── */
    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: var(--r-xl);
      padding: 2rem;
      box-shadow: var(--shadow-md);
      color: var(--text-dark);
    }

    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 19px; font-weight: 500;
      color: var(--bg-start);
      margin-bottom: 1.5rem;
      text-align: center;
    }

    /* ── Messages ── */
    .msg {
      display: none;
      padding: 11px 14px;
      border-radius: var(--r-md);
      font-size: 13px;
      margin-bottom: 1.25rem;
      line-height: 1.45;
    }

    .msg-error   { background: var(--danger-lt);  color: var(--danger);  border: 1px solid var(--danger-pale); }
    .msg-success { background: var(--success-lt); color: var(--success); border: 1px solid var(--success-pale); }

    /* ── Form groups ── */
    .form-group { margin-bottom: 1.1rem; }

    .form-label {
      display: block;
      font-size: 11.5px; font-weight: 500;
      letter-spacing: .7px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 7px;
    }

    .form-input {
      width: 100%;
      height: 50px;
      padding: 0 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--r-md);
      background: #fff;
      color: var(--text-dark);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px; font-weight: 400;
      transition: border-color .15s, box-shadow .15s;
      appearance: none;
    }

    .form-input::placeholder { color: var(--text-faint); font-weight: 300; }

    .form-input:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(44,125,160,.12);
    }

    .form-hint {
      font-size: 11px;
      color: var(--text-faint);
      margin-top: 5px;
      font-weight: 300;
    }

    /* ── PIN section ── */

    /* Dot display — always visible above the pad */
    .pin-display {
      font-family: 'DM Mono', monospace;
      font-size: 28px;
      letter-spacing: 14px;
      color: var(--brand-dark);
      text-align: center;
      padding: 12px 12px 12px 26px; /* offset for letter-spacing gap */
      background: var(--brand-lt);
      border: 1.5px solid var(--brand-pale);
      border-radius: var(--r-md);
      margin-bottom: 10px;
      user-select: none;
      cursor: default;
    }

    /* Hidden real input that captures keyboard events */
    .pin-real-input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      width: 1px; height: 1px;
      top: 0; left: 0;
    }

    /* PIN grid — always shown */
    .pin-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 6px;
      position: relative; /* for the real input to anchor */
    }

    .pin-btn {
      height: 52px;
      border: 1.5px solid var(--border);
      border-radius: var(--r-md);
      background: var(--surface);
      color: var(--text-dark);
      font-family: 'DM Sans', sans-serif;
      font-size: 17px; font-weight: 500;
      cursor: pointer;
      transition: background .12s, border-color .12s, transform .1s;
      -webkit-tap-highlight-color: transparent;
    }

    .pin-btn:hover  { background: var(--brand-lt); border-color: var(--brand-pale); }
    .pin-btn:active { transform: scale(.96); }

    .pin-back {
      font-size: 19px;
      background: var(--surface);
    }

    .pin-clear {
      background: var(--danger-lt);
      color: var(--danger);
      border-color: var(--danger-pale);
      font-size: 13px; font-weight: 500;
    }

    .pin-clear:hover { background: #ffe4e4; border-color: #ffb8b8; }

    /* Keyboard hint */
    .pin-hint {
      text-align: center;
      font-size: 11px;
      color: var(--text-faint);
      font-weight: 300;
      margin-top: 2px;
    }

    .pin-hint kbd {
      display: inline-block;
      padding: 1px 5px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--text-muted);
    }

    /* ── Login button ── */
    .login-btn {
      width: 100%;
      height: 50px;
      margin-top: 1.1rem;
      border: none;
      border-radius: var(--r-pill);
      background: linear-gradient(110deg, var(--success) 0%, #1f9d65 100%);
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 14.5px; font-weight: 500;
      letter-spacing: .3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(18,122,75,.25);
      transition: filter .18s, transform .1s, box-shadow .18s;
    }

    .login-btn:hover:not(:disabled)  { filter: brightness(1.06); box-shadow: 0 10px 26px rgba(18,122,75,.32); }
    .login-btn:active:not(:disabled) { transform: scale(.985); }
    .login-btn:disabled {
      background: var(--border);
      color: var(--text-faint);
      box-shadow: none;
      cursor: not-allowed;
    }

    .spinner-sm {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Server status ── */
    .server-status {
      margin-top: 1.1rem;
      text-align: center;
      padding: 9px 16px;
      border-radius: var(--r-pill);
      font-size: 11.5px; font-weight: 400;
      color: var(--text-faint);
      background: var(--surface);
      border: 1px solid var(--border-lt);
      transition: background .3s, color .3s, border-color .3s;
    }

    .server-status .dot {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: currentColor;
      margin-right: 6px;
      vertical-align: middle;
      opacity: .65;
    }

    .server-status.online  { background: var(--success-lt);  color: var(--success); border-color: var(--success-pale); }
    .server-status.offline { background: var(--danger-lt);   color: var(--danger);  border-color: var(--danger-pale); }

    /* ── Footer ── */
    .footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 11px;
      color: rgba(255,255,255,.32);
      font-weight: 300;
      line-height: 1.8;
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      body { padding: 1.25rem .75rem; align-items: flex-start; }
      .shell { min-height: calc(100dvh - 2.5rem); display: flex; flex-direction: column; justify-content: center; }
      .card { padding: 1.5rem 1.25rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

<main class="shell">

  <header class="header">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </div>
    <div class="bank-name">First Community Bank</div>
    <div class="bank-sub">Queue Management System</div>
    <a href="index.html" class="back-link">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Back to home
    </a>
  </header>

  <div class="card">
    <div class="card-title">Teller Sign In</div>

    <div class="msg msg-error"   id="errorMessage"   aria-live="polite"></div>
    <div class="msg msg-success" id="successMessage" aria-live="polite"></div>

    <form id="loginForm" novalidate>

      <!-- Teller number -->
      <div class="form-group">
        <label class="form-label" for="tellerNumber">Teller Number</label>
        <input
          type="text"
          class="form-input"
          id="tellerNumber"
          placeholder="e.g. 1001"
          inputmode="numeric"
          pattern="[0-9]*"
          autocomplete="username"
          enterkeyhint="next"
          required
        />
        <div class="form-hint">Digits only</div>
      </div>

      <!-- PIN — dot display + pad always shown; keyboard works automatically -->
      <div class="form-group">
        <label class="form-label">Secure PIN</label>

        <!-- Dot progress display -->
        <div class="pin-display" id="pinDisplay" aria-hidden="true">○○○○</div>

        <!-- Invisible real input — receives focus for keyboard entry -->
        <input
          type="password"
          class="pin-real-input"
          id="pinCode"
          maxlength="4"
          inputmode="numeric"
          autocomplete="current-password"
          aria-label="Secure PIN"
          required
        />

        <!-- On-screen PIN pad -->
        <div class="pin-grid" id="pinGrid">
          <button type="button" class="pin-btn" data-d="1">1</button>
          <button type="button" class="pin-btn" data-d="2">2</button>
          <button type="button" class="pin-btn" data-d="3">3</button>
          <button type="button" class="pin-btn" data-d="4">4</button>
          <button type="button" class="pin-btn" data-d="5">5</button>
          <button type="button" class="pin-btn" data-d="6">6</button>
          <button type="button" class="pin-btn" data-d="7">7</button>
          <button type="button" class="pin-btn" data-d="8">8</button>
          <button type="button" class="pin-btn" data-d="9">9</button>
          <button type="button" class="pin-btn pin-clear" id="pinClear">Clear</button>
          <button type="button" class="pin-btn" data-d="0">0</button>
          <button type="button" class="pin-btn pin-back" id="pinBack">⌫</button>
        </div>

        <div class="pin-hint">Tap the pad or type on your <kbd>keyboard</kbd> — both work</div>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">
        Login to Dashboard
      </button>

    </form>

    <div class="server-status" id="serverStatus">
      <span class="dot"></span>Verifying secure connection…
    </div>
  </div>

  <footer class="footer">
    <div>© 2025 First Community Bank · Queue System</div>
    <div>Contact admin for PIN reset · Secure environment</div>
  </footer>

</main>

<script>
  const API_BASE_URL      = 'https://web-production-9a5d1.up.railway.app';
  const ADMIN_TELLER_NUMS = [8];

  const loginForm   = document.getElementById('loginForm');
  const tellerInput = document.getElementById('tellerNumber');
  const pinInput    = document.getElementById('pinCode');
  const pinDisplay  = document.getElementById('pinDisplay');
  const pinGrid     = document.getElementById('pinGrid');
  const loginBtn    = document.getElementById('loginBtn');
  const errorDiv    = document.getElementById('errorMessage');
  const successDiv  = document.getElementById('successMessage');
  const statusEl    = document.getElementById('serverStatus');

  // ── PIN display sync ──
  function updatePinDisplay() {
    const n = pinInput.value.length;
    pinDisplay.textContent = '●'.repeat(n) + '○'.repeat(4 - n);
  }

  // Clicking anywhere on the display or pad area focuses the hidden input
  // so physical keyboard digits flow straight in
  function focusPin() { pinInput.focus(); }

  pinDisplay.addEventListener('click', focusPin);
  pinGrid.addEventListener('click', focusPin);

  // On-screen pad buttons
  pinGrid.querySelectorAll('[data-d]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (pinInput.value.length < 4) {
        pinInput.value += btn.dataset.d;
        updatePinDisplay();
        if (pinInput.value.length === 4) loginBtn.focus();
      }
    });
  });

  document.getElementById('pinBack').addEventListener('click', () => {
    pinInput.value = pinInput.value.slice(0, -1);
    updatePinDisplay();
    focusPin();
  });

  document.getElementById('pinClear').addEventListener('click', () => {
    pinInput.value = '';
    updatePinDisplay();
    focusPin();
  });

  // Keyboard input on the hidden field updates the display live
  pinInput.addEventListener('input', () => {
    pinInput.value = pinInput.value.replace(/\D/g, '').slice(0, 4);
    updatePinDisplay();
    if (pinInput.value.length === 4) loginBtn.focus();
  });

  // Enter on PIN submits
  pinInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); loginForm.requestSubmit(); }
  });

  // ── Teller number field ──
  tellerInput.addEventListener('input', () => {
    tellerInput.value = tellerInput.value.replace(/\D/g, '');
  });

  tellerInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); focusPin(); }
  });

  tellerInput.addEventListener('wheel', e => e.preventDefault(), { passive: false });

  // ── Messages ──
  function hideMessages() { errorDiv.style.display = successDiv.style.display = 'none'; }

  function showError(msg, ms = 5000) {
    errorDiv.textContent = msg; errorDiv.style.display = 'block'; successDiv.style.display = 'none';
    if (ms) setTimeout(() => { errorDiv.style.display = 'none'; }, ms);
  }

  function showSuccess(msg, ms = 2500) {
    successDiv.textContent = msg; successDiv.style.display = 'block'; errorDiv.style.display = 'none';
    if (ms) setTimeout(() => { successDiv.style.display = 'none'; }, ms);
  }

  // ── Server health ──
  async function checkServer() {
    try {
      const ctrl = new AbortController();
      setTimeout(() => ctrl.abort(), 5000);
      const res  = await fetch(`${API_BASE_URL}/api/health`, { signal: ctrl.signal });
      const data = await res.json();
      if (data?.status === 'ok') {
        statusEl.innerHTML = '<span class="dot"></span>Server online · Secure channel ready';
        statusEl.className = 'server-status online';
        return true;
      }
      throw new Error();
    } catch {
      statusEl.innerHTML = '<span class="dot"></span>Server unreachable · Contact admin';
      statusEl.className = 'server-status offline';
      return false;
    }
  }

  // ── Login API ──
  async function performLogin(tellerNumber, pin) {
    const res  = await fetch(`${API_BASE_URL}/api/tellers/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ teller_number: parseInt(tellerNumber, 10), pin_code: pin })
    });
    const ct   = res.headers.get('content-type') || '';
    const data = ct.includes('application/json')
      ? await res.json()
      : (() => { throw new Error('Invalid server response'); })();
    if (!res.ok || !data.success) throw new Error(data.message || `Login failed (${res.status})`);
    return data;
  }

  // ── Loading state ──
  function setLoading(on) {
    loginBtn.disabled  = on;
    loginBtn.innerHTML = on
      ? '<div class="spinner-sm"></div> Verifying credentials…'
      : 'Login to Dashboard';
  }

  // ── Submit ──
  async function handleSubmit(e) {
    e.preventDefault();
    hideMessages();

    const tNum = tellerInput.value.trim();
    const pin  = pinInput.value.trim();

    if (!tNum || !/^\d+$/.test(tNum))  { showError('Please enter a valid teller number.'); tellerInput.focus(); return; }
    if (!pin  || !/^\d{4}$/.test(pin)) { showError('Please enter your 4-digit PIN.'); focusPin(); return; }

    setLoading(true);
    try {
      const result  = await performLogin(tNum, pin);
      const t       = result.teller;
      const isAdmin = ADMIN_TELLER_NUMS.includes(t.teller_number);

      sessionStorage.setItem('loggedInTeller', JSON.stringify({
        id:               t.id,
        teller_number:    t.teller_number,
        teller_name:      t.teller_name || `Teller ${t.teller_number}`,
        name:             t.teller_name || `Teller ${t.teller_number}`,
        serving_category: t.serving_category || 'General',
        serviceCategory:  t.serving_category || 'General',
        email:            t.email  || `teller${t.teller_number}@firstbank.local`,
        phone:            t.phone  || '',
        status:           t.status || 'active',
        loginTimestamp:   new Date().toISOString(),
        isAdmin
      }));

      showSuccess(isAdmin
        ? 'Admin access granted. Redirecting to management panel…'
        : 'Access granted. Redirecting to teller dashboard…'
      );
      setTimeout(() => {
        window.location.href = isAdmin ? 'teller-management.html' : 'teller-dashboard.html';
      }, 900);

    } catch (err) {
      let msg = err.message || 'Network error.';
      if (msg.includes('fetch') || msg.includes('Network'))
        msg = 'Could not connect to server. Please check your connection.';
      showError(msg);
      setLoading(false);
    }
  }

  loginForm.addEventListener('submit', handleSubmit);

  // ── Session check ──
  function checkSession() {
    try {
      const t = JSON.parse(sessionStorage.getItem('loggedInTeller') || 'null');
      if (t?.id) window.location.href = (t.isAdmin || ADMIN_TELLER_NUMS.includes(t.teller_number))
        ? 'teller-management.html' : 'teller-dashboard.html';
    } catch {}
  }

  // ── Init ──
  function init() {
    checkSession();
    checkServer();
    updatePinDisplay();
    tellerInput.focus();
  }

  init();
</script>
</body>
</html>
