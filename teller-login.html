<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>Teller Access | First Community Bank Queue System</title>

  <style>
    :root {
      --bg-start: #0b2b44;
      --bg-end: #123e6a;
      --card-bg: rgba(255, 255, 255, 0.98);
      --text-dark: #0f172a;
      --text-muted: #475569;
      --brand: #2c7da0;
      --brand-dark: #1f5f7c;
      --success: #127a4b;
      --success-dark: #0e5d39;
      --danger: #c7362b;
      --danger-bg: #fff1f1;
      --success-bg: #ecfdf3;
      --border: #dbe4ee;
      --input-bg: #ffffff;
      --surface: #f8fafc;
      --shadow: 0 24px 50px rgba(0, 0, 0, 0.22);
      --radius-xl: 32px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: "Segoe UI", "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Roboto", sans-serif;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: white;
      background:
        radial-gradient(circle at top right, rgba(255,255,255,0.08), transparent 30%),
        linear-gradient(145deg, var(--bg-start) 0%, var(--bg-end) 100%);
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(rgba(255,255,255,0.045) 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.8;
    }

    .login-shell {
      width: 100%;
      max-width: 500px;
      position: relative;
      z-index: 1;
      animation: fadeSlideUp 0.5s ease-out;
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      text-align: center;
      margin-bottom: 22px;
    }

    .bank-logo {
      font-size: clamp(2.7rem, 7vw, 4rem);
      line-height: 1;
      margin-bottom: 8px;
      filter: drop-shadow(0 8px 14px rgba(0,0,0,0.22));
    }

    .bank-name {
      font-size: clamp(1.35rem, 4vw, 1.8rem);
      font-weight: 800;
      letter-spacing: 0.06em;
      line-height: 1.2;
      background: linear-gradient(135deg, #ffffff, #d9f0ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .tagline {
      font-size: 0.92rem;
      opacity: 0.88;
      margin-top: 6px;
      font-weight: 500;
    }

    .back-home {
      margin-top: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      min-height: 42px;
      border-radius: 999px;
      text-decoration: none;
      color: #fff;
      font-size: 0.875rem;
      font-weight: 600;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(6px);
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    }

    .back-home:hover,
    .back-home:focus-visible {
      background: rgba(255,255,255,0.2);
      border-color: rgba(255,255,255,0.28);
      transform: translateY(-1px);
      outline: none;
    }

    .login-card {
      background: var(--card-bg);
      color: var(--text-dark);
      border-radius: var(--radius-xl);
      padding: 30px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,0.28);
      backdrop-filter: blur(8px);
    }

    .login-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      font-size: clamp(1.35rem, 4vw, 1.7rem);
      font-weight: 800;
      color: #0b2b44;
      margin-bottom: 24px;
    }

    .message {
      display: none;
      margin-bottom: 16px;
      padding: 14px 16px;
      border-radius: 16px;
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.4;
      text-align: center;
    }

    .error-message {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid #ffd4d4;
    }

    .success-message {
      background: var(--success-bg);
      color: #146c43;
      border: 1px solid #c7f0d8;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 0.92rem;
      font-weight: 700;
      color: #1f3a5f;
    }

    .input-wrap {
      position: relative;
    }

    .form-input {
      width: 100%;
      min-height: 54px;
      padding: 14px 18px;
      border: 2px solid var(--border);
      border-radius: 18px;
      background: var(--input-bg);
      color: var(--text-dark);
      font-size: 1rem;
      font-weight: 600;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
      appearance: none;
    }

    .form-input::placeholder {
      color: #94a3b8;
      font-weight: 500;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 4px rgba(44, 125, 160, 0.14);
    }

    .form-help {
      margin-top: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .login-btn {
      width: 100%;
      min-height: 56px;
      margin-top: 8px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(105deg, var(--success), #1f9d65);
      color: white;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      box-shadow: 0 10px 24px rgba(18, 122, 75, 0.28);
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
    }

    .login-btn:hover:not(:disabled),
    .login-btn:focus-visible:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(18, 122, 75, 0.34);
      filter: brightness(1.02);
      outline: none;
    }

    .login-btn:disabled {
      opacity: 0.75;
      cursor: wait;
    }

    .submit-hint {
      margin-top: 10px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .server-status {
      margin-top: 18px;
      text-align: center;
      padding: 11px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      background: #f1f5f9;
      color: #1e293b;
    }

    .server-online {
      color: #0f5e3a;
      background: #e6f8ef;
    }

    .server-offline {
      color: #b91c1c;
      background: #fee2e2;
    }

    .pin-display {
      display: none;
      margin-top: 10px;
      text-align: center;
      font-family: "Courier New", monospace;
      font-size: 1.8rem;
      letter-spacing: 10px;
      font-weight: 800;
      padding: 14px 12px;
      border-radius: 18px;
      background: #f1f5f9;
      color: #0b2b44;
      user-select: none;
    }

    .pin-grid {
      display: none;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .pin-btn {
      min-height: 56px;
      border-radius: 18px;
      border: 1.5px solid #d4dde8;
      background: #f8fafc;
      color: #0f172a;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.12s ease, border-color 0.12s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .pin-btn:hover,
    .pin-btn:focus-visible {
      background: #eef4f8;
      border-color: #bfd0df;
      outline: none;
    }

    .pin-btn:active {
      transform: scale(0.97);
    }

    .pin-clear {
      background: #fff1f1;
      color: #b91c1c;
      border-color: #fecaca;
    }

    .toggle-pin {
      margin-top: 12px;
      text-align: center;
    }

    .toggle-pin a {
      color: var(--brand);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 700;
      border-bottom: 1px dashed rgba(44, 125, 160, 0.45);
    }

    .toggle-pin a:hover,
    .toggle-pin a:focus-visible {
      color: var(--brand-dark);
      outline: none;
    }

    .loading-spinner-sm {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.9);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer {
      margin-top: 18px;
      text-align: center;
      color: rgba(255,255,255,0.8);
      font-size: 0.8rem;
      line-height: 1.55;
    }

    @media (max-width: 640px) {
      body {
        padding: 16px;
        align-items: stretch;
      }

      .login-shell {
        max-width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: calc(100svh - 32px);
      }

      .login-card {
        padding: 24px 18px;
        border-radius: 26px;
      }

      .pin-btn {
        min-height: 52px;
        font-size: 1.1rem;
      }

      .form-input {
        min-height: 52px;
      }
    }

    @media (max-width: 380px) {
      .login-card {
        padding: 20px 16px;
      }

      .bank-name {
        letter-spacing: 0.03em;
      }

      .pin-display {
        font-size: 1.5rem;
        letter-spacing: 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="login-shell">
    <header class="header">
      <div class="bank-logo" aria-hidden="true">🏛️💰</div>
      <div class="bank-name">FIRST COMMUNITY BANK</div>
      <div class="tagline">Secure Teller Access · Queue Management</div>

      <a href="index.html" class="back-home">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        Back to Home
      </a>
    </header>

    <section class="login-card" aria-labelledby="loginTitle">
      <h1 class="login-title" id="loginTitle">
        <span aria-hidden="true">🔐</span>
        Teller Login
      </h1>

      <div class="message error-message" id="errorMessage" aria-live="polite"></div>
      <div class="message success-message" id="successMessage" aria-live="polite"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="tellerNumber">
            <span aria-hidden="true">👤</span>
            Teller Number
          </label>
          <div class="input-wrap">
            <input
              type="text"
              class="form-input"
              id="tellerNumber"
              name="tellerNumber"
              placeholder="e.g., 1001"
              inputmode="numeric"
              pattern="[0-9]*"
              autocomplete="username"
              enterkeyhint="next"
              required
            />
          </div>
          <div class="form-help">Use digits only.</div>
        </div>

        <div class="form-group" id="pinInputGroup">
          <label class="form-label" for="pinCode">
            <span aria-hidden="true">🔒</span>
            Secure PIN
          </label>
          <div class="input-wrap">
            <input
              type="password"
              class="form-input"
              id="pinCode"
              name="pinCode"
              placeholder="Enter 4-digit PIN"
              maxlength="4"
              inputmode="numeric"
              pattern="[0-9]{4}"
              autocomplete="current-password"
              enterkeyhint="go"
              required
            />
          </div>
          <div class="form-help">4 digits required.</div>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          <span aria-hidden="true">🔓</span>
          <span>LOGIN TO DASHBOARD</span>
        </button>

        <div class="submit-hint">Press Enter to submit</div>
      </form>

      <div class="server-status" id="serverStatus">
        🔌 Verifying secure connection...
      </div>
    </section>

    <footer class="footer">
      <p>© 2025 First Community Bank | Next-gen Queue System</p>
      <p>📞 Contact admin for PIN reset | Secure environment</p>
    </footer>
  </main>

  <script>
    const API_BASE_URL = "https://web-production-9a5d1.up.railway.app";
    const ADMIN_TELLER_NUMBERS = [8];

    const loginForm = document.getElementById("loginForm");
    const tellerInput = document.getElementById("tellerNumber");
    const pinInput = document.getElementById("pinCode");
    const loginBtn = document.getElementById("loginBtn");
    const errorDiv = document.getElementById("errorMessage");
    const successDiv = document.getElementById("successMessage");
    const serverStatusSpan = document.getElementById("serverStatus");

    let pinPadActive = false;
    let virtualPinButtonsAdded = false;

    function hideMessages() {
      errorDiv.style.display = "none";
      successDiv.style.display = "none";
    }

    function showError(message, duration = 4500) {
      errorDiv.textContent = message;
      errorDiv.style.display = "block";
      successDiv.style.display = "none";

      setTimeout(() => {
        if (errorDiv.style.display === "block") errorDiv.style.display = "none";
      }, duration);
    }

    function showSuccess(message, duration = 2200) {
      successDiv.textContent = message;
      successDiv.style.display = "block";
      errorDiv.style.display = "none";

      setTimeout(() => {
        if (successDiv.style.display === "block") successDiv.style.display = "none";
      }, duration);
    }

    async function checkServerConnection() {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000);

        const response = await fetch(`${API_BASE_URL}/api/health`, {
          method: "GET",
          headers: { Accept: "application/json" },
          signal: controller.signal
        });

        clearTimeout(timeoutId);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        if (data?.status === "ok") {
          serverStatusSpan.innerHTML = "✅ Server Online · Secure channel ready";
          serverStatusSpan.className = "server-status server-online";
          return true;
        }

        throw new Error("unhealthy");
      } catch (err) {
        console.warn("Health check failed:", err);
        serverStatusSpan.innerHTML =
          "⚠️ Server unreachable — using offline demo mode (contact admin)";
        serverStatusSpan.className = "server-status server-offline";
        return false;
      }
    }

    async function performLogin(tellerNumber, pinCode) {
      const payload = {
        teller_number: parseInt(tellerNumber, 10),
        pin_code: pinCode
      };

      const response = await fetch(`${API_BASE_URL}/api/tellers/login`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Accept: "application/json"
        },
        body: JSON.stringify(payload)
      });

      let result;
      const contentType = response.headers.get("content-type");

      if (contentType && contentType.includes("application/json")) {
        result = await response.json();
      } else {
        const text = await response.text();
        throw new Error(`Invalid server response: ${text.substring(0, 80)}`);
      }

      if (!response.ok) {
        throw new Error(result.message || `Login failed (${response.status})`);
      }

      if (!result.success) {
        throw new Error(result.message || "Invalid teller number or PIN");
      }

      return result;
    }

    function setLoadingState(isLoading) {
      if (isLoading) {
        loginBtn.disabled = true;
        loginBtn.innerHTML =
          '<span aria-hidden="true">⏳</span><span>VERIFYING CREDENTIALS</span><span class="loading-spinner-sm" aria-hidden="true"></span>';
      } else {
        loginBtn.disabled = false;
        loginBtn.innerHTML =
          '<span aria-hidden="true">🔓</span><span>LOGIN TO DASHBOARD</span>';
      }
    }

    function sanitizeNumericInput(input, maxLength = Infinity) {
      input.value = input.value.replace(/\D/g, "").slice(0, maxLength);
    }

    async function handleLoginSubmit(event) {
      event.preventDefault();
      hideMessages();

      const tellerNumberRaw = tellerInput.value.trim();
      const pinRaw = pinInput.value.trim();

      if (!tellerNumberRaw) {
        showError("📛 Please enter your teller number");
        tellerInput.focus();
        return;
      }

      if (!/^\d+$/.test(tellerNumberRaw)) {
        showError("Teller number must contain only digits");
        tellerInput.focus();
        return;
      }

      if (!pinRaw) {
        showError("🔢 Please enter your 4-digit PIN");
        pinInput.focus();
        return;
      }

      if (!/^\d{4}$/.test(pinRaw)) {
        showError("PIN must be exactly 4 digits");
        pinInput.focus();
        return;
      }

      setLoadingState(true);

      try {
        const loginResult = await performLogin(tellerNumberRaw, pinRaw);

        if (loginResult.success && loginResult.teller) {
          const tellerData = loginResult.teller;
          const tellerNumberFromBackend = tellerData.teller_number;

          const loggedInTeller = {
            id: tellerData.id,
            teller_number: tellerData.teller_number,
            teller_name: tellerData.teller_name || `Teller ${tellerData.teller_number}`,
            name: tellerData.teller_name || `Teller ${tellerData.teller_number}`,
            serving_category: tellerData.serving_category || "General",
            serviceCategory: tellerData.serving_category || "General",
            email: tellerData.email || `teller${tellerData.teller_number}@firstbank.local`,
            phone: tellerData.phone || "",
            status: tellerData.status || "active",
            loginTimestamp: new Date().toISOString(),
            isAdmin: ADMIN_TELLER_NUMBERS.includes(tellerNumberFromBackend)
          };

          sessionStorage.setItem("loggedInTeller", JSON.stringify(loggedInTeller));

          const redirectPage = loggedInTeller.isAdmin
            ? "teller-management.html"
            : "teller-dashboard.html";

          showSuccess(
            loggedInTeller.isAdmin
              ? "✅ Admin access granted! Redirecting to management panel..."
              : "✅ Access granted! Redirecting to teller dashboard..."
          );

          setTimeout(() => {
            window.location.href = redirectPage;
          }, 900);

          return;
        }

        throw new Error(loginResult.message || "Authentication failed");
      } catch (err) {
        console.error("Login API error:", err);

        let userMessage = err.message || "Network error. Unable to reach authentication server.";

        if (
          err.message.includes("Failed to fetch") ||
          err.message.includes("NetworkError")
        ) {
          userMessage =
            "🌐 Network error: Could not connect to bank server. Please verify backend is running or contact support.";
        } else if (
          err.message.toLowerCase().includes("pin") ||
          err.message.toLowerCase().includes("teller")
        ) {
          userMessage = err.message;
        } else {
          userMessage = "Login service unavailable. Please try again later.";
        }

        showError(`❌ ${userMessage}`);
        setLoadingState(false);
      }
    }

    function createPinPadUI() {
      const pinGroup = document.getElementById("pinInputGroup");
      if (!pinGroup || virtualPinButtonsAdded) return;

      const pinDisplayDiv = document.createElement("div");
      pinDisplayDiv.className = "pin-display";
      pinDisplayDiv.id = "dynamicPinDisplay";
      pinDisplayDiv.textContent = "○○○○";
      pinGroup.appendChild(pinDisplayDiv);

      const pinGrid = document.createElement("div");
      pinGrid.className = "pin-grid";
      pinGrid.id = "virtualPinGrid";
      pinGrid.innerHTML = `
        <button type="button" class="pin-btn" data-pin-digit="1">1</button>
        <button type="button" class="pin-btn" data-pin-digit="2">2</button>
        <button type="button" class="pin-btn" data-pin-digit="3">3</button>
        <button type="button" class="pin-btn" data-pin-digit="4">4</button>
        <button type="button" class="pin-btn" data-pin-digit="5">5</button>
        <button type="button" class="pin-btn" data-pin-digit="6">6</button>
        <button type="button" class="pin-btn" data-pin-digit="7">7</button>
        <button type="button" class="pin-btn" data-pin-digit="8">8</button>
        <button type="button" class="pin-btn" data-pin-digit="9">9</button>
        <button type="button" class="pin-btn">•</button>
        <button type="button" class="pin-btn" data-pin-digit="0">0</button>
        <button type="button" class="pin-btn" id="pinBackspaceBtn">⌫</button>
      `;
      pinGroup.appendChild(pinGrid);

      const toggleContainer = document.createElement("div");
      toggleContainer.className = "toggle-pin";
      toggleContainer.innerHTML = '<a href="#" id="togglePinModeLink">⌨️ Switch to keyboard input</a>';
      pinGroup.appendChild(toggleContainer);

      pinGrid.querySelectorAll("[data-pin-digit]").forEach((btn) => {
        btn.addEventListener("click", () => {
          if (pinInput.value.length < 4) {
            pinInput.value += btn.dataset.pinDigit;
            updateVirtualPinDisplay();
            if (pinInput.value.length === 4) {
              loginBtn.focus();
            }
          }
        });
      });

      document.getElementById("pinBackspaceBtn")?.addEventListener("click", () => {
        pinInput.value = pinInput.value.slice(0, -1);
        updateVirtualPinDisplay();
      });

      virtualPinButtonsAdded = true;
      updateVirtualPinDisplay();
    }

    function updateVirtualPinDisplay() {
      const displayDiv = document.getElementById("dynamicPinDisplay");
      if (!displayDiv) return;

      const len = pinInput.value.length;
      displayDiv.textContent = "●".repeat(len) + "○".repeat(4 - len);
    }

    function togglePinInputMode() {
      const pinDisplayDiv = document.getElementById("dynamicPinDisplay");
      const pinGridElem = document.getElementById("virtualPinGrid");
      const toggleLink = document.getElementById("togglePinModeLink");

      if (!pinDisplayDiv || !pinGridElem) return;

      if (pinPadActive) {
        pinInput.style.display = "block";
        pinDisplayDiv.style.display = "none";
        pinGridElem.style.display = "none";
        if (toggleLink) toggleLink.textContent = "📱 Switch to PIN pad";
        pinPadActive = false;
        pinInput.focus();
      } else {
        pinInput.style.display = "none";
        pinDisplayDiv.style.display = "block";
        pinGridElem.style.display = "grid";
        if (toggleLink) toggleLink.textContent = "⌨️ Switch to keyboard input";
        pinPadActive = true;
        updateVirtualPinDisplay();
      }
    }

    function initializePinPadForTouch() {
      createPinPadUI();

      const pinDisplayDiv = document.getElementById("dynamicPinDisplay");
      const pinGridElem = document.getElementById("virtualPinGrid");
      const toggleLinkElem = document.getElementById("togglePinModeLink");
      const isTouch = "ontouchstart" in window || navigator.maxTouchPoints > 0;

      if (isTouch) {
        pinInput.style.display = "none";
        pinDisplayDiv.style.display = "block";
        pinGridElem.style.display = "grid";
        pinPadActive = true;
      } else {
        pinInput.style.display = "block";
        pinDisplayDiv.style.display = "none";
        pinGridElem.style.display = "none";
        pinPadActive = false;
      }

      toggleLinkElem?.addEventListener("click", (e) => {
        e.preventDefault();
        togglePinInputMode();
      });

      updateVirtualPinDisplay();
    }

    function checkExistingSession() {
      const existing = sessionStorage.getItem("loggedInTeller");
      if (!existing) return;

      try {
        const teller = JSON.parse(existing);
        if (teller?.id) {
          if (teller.isAdmin || ADMIN_TELLER_NUMBERS.includes(teller.teller_number)) {
            window.location.href = "teller-management.html";
          } else {
            window.location.href = "teller-dashboard.html";
          }
        }
      } catch (e) {
        console.warn("Invalid stored session:", e);
      }
    }

    function enableKeyboardSubmission() {
      [tellerInput, pinInput].forEach((input) => {
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();

            if (input === tellerInput && !pinInput.value.trim()) {
              pinInput.focus();
              return;
            }

            loginForm.requestSubmit();
          }
        });
      });
    }

    function attachInputRules() {
      tellerInput.addEventListener("input", () => {
        sanitizeNumericInput(tellerInput);
      });

      pinInput.addEventListener("input", () => {
        sanitizeNumericInput(pinInput, 4);
        updateVirtualPinDisplay();
      });
    }

    async function init() {
      checkExistingSession();
      attachInputRules();
      enableKeyboardSubmission();
      initializePinPadForTouch();
      await checkServerConnection();

      loginForm.addEventListener("submit", handleLoginSubmit);

      tellerInput.addEventListener("wheel", (e) => e.preventDefault(), {
        passive: false
      });

      tellerInput.focus();
    }

    init();
  </script>
</body>
</html>
