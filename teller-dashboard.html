<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teller Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            color: #1a1a2e;
        }

        /* ── HEADER ── */
        .header {
            background: #1e3c72;
            color: white;
            padding: 0 24px;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .logo span { color: #ffd700; }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .teller-chip {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.12);
            border-radius: 30px;
            padding: 6px 16px;
        }

        .teller-chip .name {
            font-weight: 600;
            font-size: 14px;
        }

        .pill {
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .pill-available { background: #00c853; color: #fff; }
        .pill-busy      { background: #ff9800; color: #fff; }
        .pill-called    { background: #2196f3; color: #fff; }

        .logout-btn {
            background: transparent;
            color: rgba(255,255,255,0.8);
            border: 1px solid rgba(255,255,255,0.3);
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .logout-btn:hover { background: #c62828; border-color: #c62828; color: #fff; }

        /* ── LAYOUT ── */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 24px;
        }

        /* ── STATS ROW ── */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
        }

        .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .icon-blue   { background: #e3f2fd; }
        .icon-orange { background: #fff3e0; }
        .icon-green  { background: #e8f5e9; }
        .icon-purple { background: #f3e5f5; }

        .stat-text .value {
            font-size: 28px;
            font-weight: 700;
            color: #1e3c72;
            line-height: 1;
        }

        .stat-text .label {
            font-size: 12px;
            color: #888;
            margin-top: 3px;
        }

        /* ── MAIN GRID ── */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
        }

        /* ── PANEL ── */
        .panel {
            background: white;
            border-radius: 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
            overflow: hidden;
        }

        .panel-header {
            padding: 16px 20px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title {
            font-size: 15px;
            font-weight: 700;
            color: #1e3c72;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-title .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00c853;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .badge-count {
            background: #1e3c72;
            color: white;
            border-radius: 20px;
            padding: 2px 10px;
            font-size: 12px;
            font-weight: 700;
        }

        .small-btn {
            background: #f0f2f5;
            border: none;
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            color: #555;
            transition: all 0.2s;
        }

        .small-btn:hover { background: #e0e3e8; }

        /* ── QUEUE LIST ── */
        .queue-list {
            padding: 12px 16px;
            max-height: 520px;
            overflow-y: auto;
        }

        .queue-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 8px;
            border-left: 3px solid #ff9800;
            background: #fafafa;
            transition: all 0.2s;
        }

        .queue-item:hover { background: #f0f2f5; transform: translateX(3px); }

        .token-num {
            font-size: 20px;
            font-weight: 700;
            color: #1e3c72;
            font-family: monospace;
            letter-spacing: 1px;
        }

        .token-meta {
            font-size: 12px;
            color: #888;
            margin-top: 3px;
        }

        .wait-badge {
            background: #fff3e0;
            color: #e65100;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 10px;
            margin-top: 4px;
            display: inline-block;
        }

        /* call button inline */
        .call-btn {
            background: #1e3c72;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .call-btn:hover { background: #2a5298; transform: scale(1.03); }
        .call-btn:active { transform: scale(0.97); }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #aaa;
        }

        .empty-state .big { font-size: 36px; margin-bottom: 10px; }
        .empty-state p { font-size: 14px; }

        /* ── SERVING PANEL (right column) ── */
        .serving-col {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* serving card */
        .serving-card {
            background: #1e3c72;
            border-radius: 14px;
            padding: 24px 20px;
            color: white;
            text-align: center;
        }

        .serving-label {
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            opacity: 0.7;
            margin-bottom: 8px;
        }

        .serving-token-display {
            font-size: 56px;
            font-weight: 800;
            letter-spacing: 6px;
            font-family: monospace;
            margin: 8px 0;
            line-height: 1;
        }

        .serving-sub {
            font-size: 13px;
            opacity: 0.75;
        }

        .serving-status-row {
            display: flex;
            justify-content: center;
            margin-top: 12px;
        }

        /* action buttons */
        .actions-panel {
            background: white;
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
        }

        .actions-title {
            font-size: 12px;
            font-weight: 700;
            color: #aaa;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .action-btn {
            padding: 13px 10px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.18s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .action-btn:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.07); }
        .action-btn:active:not(:disabled) { transform: scale(0.97); }

        .action-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
        }

        .btn-serve    { background: #e8f5e9; color: #2e7d32; }
        .btn-complete { background: #e3f2fd; color: #1565c0; }
        .btn-recall   { background: #f3e5f5; color: #6a1b9a; }
        .btn-skip     { background: #fce4ec; color: #c62828; }

        .btn-serve span, .btn-complete span, .btn-recall span, .btn-skip span {
            font-size: 16px;
        }

        .btn-span-full {
            grid-column: 1 / -1;
        }

        /* no customer serving */
        .no-serving {
            text-align: center;
            padding: 30px 20px;
            color: #bbb;
        }

        .no-serving .big { font-size: 40px; margin-bottom: 8px; }

        /* ── ACTIVITY LOG ── */
        .log-panel {
            background: white;
            border-radius: 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
            margin-top: 20px;
            overflow: hidden;
        }

        .log-body {
            padding: 12px 16px;
            max-height: 160px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid #f5f5f5;
            color: #555;
            display: flex;
            gap: 10px;
        }

        .log-time { color: #bbb; flex-shrink: 0; }
        .log-success { color: #2e7d32; }
        .log-warning { color: #e65100; }
        .log-error   { color: #c62828; }

        /* ── TOAST ── */
        .toast-container {
            position: fixed;
            top: 70px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            background: #1e3c72;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s forwards;
            max-width: 320px;
        }

        .toast.success { background: #2e7d32; }
        .toast.error   { background: #c62828; }
        .toast.warning { background: #e65100; }

        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to   { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeOut {
            to { opacity: 0; transform: translateX(20px); }
        }

        /* ── SPINNER ── */
        .spinner {
            width: 24px; height: 24px;
            border: 3px solid #e0e0e0;
            border-top-color: #1e3c72;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── RESPONSIVE ── */
        @media (max-width: 900px) {
            .main-grid { grid-template-columns: 1fr; }
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .serving-col { order: -1; }
            .serving-token-display { font-size: 40px; letter-spacing: 4px; }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">🏦 Queue <span>Manager</span></div>
    <div class="header-right">
        <div class="teller-chip">
            <span class="name" id="tellerName">Loading...</span>
            <span class="pill pill-available" id="tellerStatusPill">Available</span>
            <span id="currentTokenBadge" style="font-size:12px;font-weight:600;"></span>
        </div>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<div class="container">

    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-icon icon-blue">⏳</div>
            <div class="stat-text">
                <div class="value" id="waitingCount">0</div>
                <div class="label">Waiting</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon icon-orange">🔔</div>
            <div class="stat-text">
                <div class="value" id="calledCount">0</div>
                <div class="label">Called</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon icon-green">✅</div>
            <div class="stat-text">
                <div class="value" id="completedToday">0</div>
                <div class="label">Completed today</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon icon-purple">👥</div>
            <div class="stat-text">
                <div class="value" id="servingCount">0</div>
                <div class="label">Being served</div>
            </div>
        </div>
    </div>

    <div class="main-grid">

        <!-- LEFT: QUEUE LIST -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">
                    <div class="dot"></div>
                    Waiting Queue
                    <span class="badge-count" id="queueBadge">0</span>
                </div>
                <button class="small-btn" onclick="loadWaitingList()">↻ Refresh</button>
            </div>
            <div id="queueContainer" class="queue-list">
                <div style="text-align:center;padding:40px;">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>

        <!-- RIGHT: SERVING + ACTIONS -->
        <div class="serving-col">

            <div class="serving-card" id="servingCard">
                <div class="no-serving">
                    <div class="big">😴</div>
                    <p style="color:rgba(255,255,255,0.5);font-size:13px;">No customer being served</p>
                </div>
            </div>

            <div class="actions-panel">
                <div class="actions-title">Actions</div>
                <div class="action-grid">
                    <button class="action-btn btn-serve" id="btnServe" onclick="serveCustomer()" disabled>
                        <span>▶</span> Start serving
                    </button>
                    <button class="action-btn btn-complete" id="btnComplete" onclick="completeService()" disabled>
                        <span>✓</span> Complete
                    </button>
                    <button class="action-btn btn-recall" id="btnRecall" onclick="recallCustomer()" disabled>
                        <span>↩</span> Recall
                    </button>
                    <button class="action-btn btn-skip" id="btnSkip" onclick="skipCustomer()" disabled>
                        <span>⏭</span> Skip
                    </button>
                </div>
            </div>

        </div>
    </div>

    <div class="log-panel">
        <div class="panel-header">
            <div class="panel-title">Activity log</div>
            <button class="small-btn" onclick="clearLog()">Clear</button>
        </div>
        <div class="log-body" id="logList">
            <div class="log-entry"><span class="log-time">[--:--:--]</span><span>Dashboard ready</span></div>
        </div>
    </div>

</div>

<script>
    // ── AUTH ──
    function checkLogin() {
        const s = sessionStorage.getItem('loggedInTeller');
        if (!s) { window.location.href = 'teller-login.html'; return null; }
        return JSON.parse(s);
    }

    const loggedInTeller = checkLogin();

    const currentTeller = {
        id: loggedInTeller?.id ?? 1,
        number: loggedInTeller?.teller_number ?? 1,
        name: loggedInTeller?.teller_name ?? loggedInTeller?.name ?? 'Teller',
        serviceCategory: loggedInTeller?.serving_category ?? loggedInTeller?.serviceCategory ?? 'W'
    };

    document.getElementById('tellerName').textContent = currentTeller.name;

    function logout() {
        sessionStorage.removeItem('loggedInTeller');
        window.location.href = 'teller-login.html';
    }

    // ── CONFIG ──
    const API_BASE_URL = "https://web-production-9a5d1.up.railway.app";

    const SERVICE_LABELS = {
        W: 'Withdrawal', L: 'Loan Application', D: 'Deposit',
        C: 'Account Opening', T: 'Cheque Processing', E: 'Enquiries'
    };

    let currentServing = null;
    let currentServingStatus = null;

    // ── API ──
    async function apiCall(endpoint, method = 'GET', data = null) {
        try {
            const opts = { method, headers: { 'Content-Type': 'application/json' } };
            if (data) opts.body = JSON.stringify(data);
            const res = await fetch(`${API_BASE_URL}${endpoint}`, opts);
            return await res.json();
        } catch (e) {
            addLog('API error: ' + e.message, 'error');
            return { success: false, message: e.message };
        }
    }

    // ── TOAST ──
    function showToast(msg, type = 'info') {
        const el = document.createElement('div');
        el.className = `toast ${type}`;
        el.textContent = msg;
        document.getElementById('toastContainer').appendChild(el);
        setTimeout(() => el.remove(), 3200);
    }

    // ── LOG ──
    function addLog(msg, type = 'info') {
        const logList = document.getElementById('logList');
        const t = new Date().toLocaleTimeString();
        const cls = type === 'success' ? 'log-success' : type === 'error' ? 'log-error' : type === 'warning' ? 'log-warning' : '';
        const div = document.createElement('div');
        div.className = 'log-entry';
        div.innerHTML = `<span class="log-time">[${t}]</span><span class="${cls}">${msg}</span>`;
        logList.insertBefore(div, logList.firstChild);
        while (logList.children.length > 60) logList.removeChild(logList.lastChild);
    }

    function clearLog() {
        document.getElementById('logList').innerHTML = '<div class="log-entry"><span class="log-time">[--:--:--]</span><span>Log cleared</span></div>';
    }

    // ── SOUND ──
    function playBeep() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = 880; gain.gain.value = 0.3;
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.8);
            osc.stop(ctx.currentTime + 0.8);
        } catch(e) {}
    }

    // ── UPDATE SERVING UI ──
    function updateServingUI(token, status) {
        currentServing = token;
        currentServingStatus = status;

        const card = document.getElementById('servingCard');
        const btnServe    = document.getElementById('btnServe');
        const btnComplete = document.getElementById('btnComplete');
        const btnRecall   = document.getElementById('btnRecall');
        const btnSkip     = document.getElementById('btnSkip');

        if (!token) {
            card.innerHTML = `
                <div class="no-serving">
                    <div class="big">😴</div>
                    <p style="color:rgba(255,255,255,0.5);font-size:13px;">No customer being served</p>
                </div>`;
            btnServe.disabled = btnComplete.disabled = btnRecall.disabled = btnSkip.disabled = true;

            const pill = document.getElementById('tellerStatusPill');
            pill.textContent = 'Available'; pill.className = 'pill pill-available';
            document.getElementById('currentTokenBadge').textContent = '';
            return;
        }

        const statusLabel = status === 'busy' ? 'Being served now' : 'Called — awaiting arrival';
        card.innerHTML = `
            <div class="serving-label">Currently serving</div>
            <div class="serving-token-display">${token}</div>
            <div class="serving-sub">${statusLabel}</div>
            <div class="serving-status-row">
                <span class="pill ${status === 'busy' ? 'pill-busy' : 'pill-called'}">
                    ${status === 'busy' ? 'Serving' : 'Called'}
                </span>
            </div>`;

        // Enable relevant buttons based on status
        if (status === 'called') {
            btnServe.disabled = false;
            btnComplete.disabled = true;
        } else {
            btnServe.disabled = true;
            btnComplete.disabled = false;
        }
        btnRecall.disabled = false;
        btnSkip.disabled = false;

        const pill = document.getElementById('tellerStatusPill');
        pill.textContent = status === 'busy' ? 'Serving' : 'Called';
        pill.className = `pill ${status === 'busy' ? 'pill-busy' : 'pill-called'}`;
        document.getElementById('currentTokenBadge').textContent = token;
    }

    // ── LOAD WAITING LIST ──
    async function loadWaitingList() {
        try {
            const res = await fetch(`${API_BASE_URL}/api/queue/waiting-list/${currentTeller.serviceCategory}`);
            const data = await res.json();
            const container = document.getElementById('queueContainer');

            if (data.success && data.waiting_tokens?.length > 0) {
                document.getElementById('waitingCount').textContent = data.waiting_tokens.length;
                document.getElementById('queueBadge').textContent = data.waiting_tokens.length;

                container.innerHTML = data.waiting_tokens.map(t => `
                    <div class="queue-item">
                        <div>
                            <div class="token-num">${t.token_number}</div>
                            <div class="token-meta">${t.customer_name || 'Guest'}${t.customer_phone ? ' · ' + t.customer_phone : ''}</div>
                            <span class="wait-badge">${t.waiting_minutes || 0} min wait</span>
                        </div>
                        <button class="call-btn" onclick="callSpecificCustomer('${t.token_number}')">Call</button>
                    </div>
                `).join('');
            } else {
                document.getElementById('waitingCount').textContent = 0;
                document.getElementById('queueBadge').textContent = 0;
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="big">🎉</div>
                        <p>Queue is empty<br><small style="color:#bbb;">${SERVICE_LABELS[currentTeller.serviceCategory] || currentTeller.serviceCategory}</small></p>
                    </div>`;
            }
        } catch (e) {
            document.getElementById('queueContainer').innerHTML = `
                <div class="empty-state"><div class="big">⚠️</div><p>Could not load queue</p></div>`;
        }
    }

    // ── LOAD CURRENT SERVING (from tellers endpoint) ──
    async function loadCurrentServing() {
        try {
            const result = await apiCall('/api/tellers');
            if (result.success && result.tellers) {
                const teller = result.tellers.find(t => t.id === currentTeller.id);
                if (teller && teller.current_token) {
                    updateServingUI(teller.current_token, teller.status);
                } else {
                    updateServingUI(null, null);
                }
            }

            const q = await apiCall('/api/queue/current');
            if (q.success && q.queue) {
                const total = q.queue.reduce((s, r) => s + (r.serving_count || 0), 0);
                const called = q.queue.reduce((s, r) => s + (r.called_count || 0), 0);
                document.getElementById('servingCount').textContent = total;
                document.getElementById('calledCount').textContent = called;
            }
        } catch (e) {
            console.error('loadCurrentServing error', e);
        }
    }

    // ── AUTO-COMPLETE PREVIOUS BEFORE CALLING NEW ──
    async function autoCompletePrevious() {
        if (currentServing) {
            addLog(`Auto-completing previous token ${currentServing}`, 'warning');
            await apiCall('/api/tellers/complete', 'POST', {
                teller_id: currentTeller.id,
                token_number: currentServing
            });
            const prev = currentServing;
            updateServingUI(null, null);
            addLog(`✓ Auto-completed ${prev}`, 'success');
            updateCompletedCount();
        }
    }

    // ── CALL SPECIFIC ──
    async function callSpecificCustomer(tokenNumber) {
        await autoCompletePrevious();

        addLog(`Calling ${tokenNumber}...`);
        const result = await apiCall('/api/tellers/call-specific', 'POST', {
            teller_id: currentTeller.id,
            teller_number: currentTeller.number,
            token_number: tokenNumber
        });

        if (result.success) {
            addLog(`Called ${tokenNumber}`, 'success');
            showToast(`Called ${tokenNumber}`, 'success');
            updateServingUI(tokenNumber, 'called');
            playBeep();
            await loadWaitingList();
        } else {
            addLog(`Failed: ${result.message}`, 'error');
            showToast(result.message || 'Failed to call', 'error');
        }
    }

    // ── SERVE ──
    async function serveCustomer() {
        if (!currentServing) return;
        const result = await apiCall('/api/tellers/serve', 'POST', {
            teller_id: currentTeller.id,
            token_number: currentServing
        });
        if (result.success) {
            addLog(`Serving ${currentServing}`, 'success');
            showToast(`Now serving ${currentServing}`, 'success');
            updateServingUI(currentServing, 'busy');
        } else {
            addLog(`Failed: ${result.message}`, 'error');
            showToast(result.message || 'Failed', 'error');
        }
    }

    // ── COMPLETE ──
    async function completeService() {
        if (!currentServing) return;
        const token = currentServing;
        const result = await apiCall('/api/tellers/complete', 'POST', {
            teller_id: currentTeller.id,
            token_number: token
        });
        if (result.success) {
            addLog(`Completed ${token}`, 'success');
            showToast(`Completed ${token}`, 'success');
            updateCompletedCount();
            updateServingUI(null, null);
            await loadWaitingList();
        } else {
            addLog(`Failed: ${result.message}`, 'error');
            showToast(result.message || 'Failed', 'error');
        }
    }

    // ── SKIP ──
    async function skipCustomer() {
        if (!currentServing) return;
        const token = currentServing;
        const result = await apiCall('/api/tellers/skip', 'POST', {
            teller_id: currentTeller.id,
            token_number: token
        });
        if (result.success) {
            addLog(`Skipped ${token}`, 'warning');
            showToast(`Skipped ${token}`, 'warning');
            updateServingUI(null, null);
            await loadWaitingList();
        } else {
            addLog(`Failed: ${result.message}`, 'error');
            showToast(result.message || 'Failed', 'error');
        }
    }

    // ── RECALL ──
    async function recallCustomer() {
        if (!currentServing) return;
        const result = await apiCall('/api/tellers/recall', 'POST', {
            teller_id: currentTeller.id,
            token_number: currentServing
        });
        if (result.success) {
            addLog(`Recall sent for ${currentServing}`, 'success');
            showToast(`Recalled ${currentServing}`, 'success');
            playBeep();
        } else {
            addLog(`Failed: ${result.message}`, 'error');
            showToast(result.message || 'Failed', 'error');
        }
    }

    function updateCompletedCount() {
        const el = document.getElementById('completedToday');
        el.textContent = (parseInt(el.textContent) || 0) + 1;
    }

    // ── INIT ──
    async function init() {
        addLog(`Logged in as ${currentTeller.name} · ${SERVICE_LABELS[currentTeller.serviceCategory] || currentTeller.serviceCategory}`, 'success');
        await loadWaitingList();
        await loadCurrentServing();
        setInterval(() => { loadWaitingList(); loadCurrentServing(); }, 5000);
    }

    // expose globals
    Object.assign(window, {
        callSpecificCustomer, serveCustomer, completeService,
        skipCustomer, recallCustomer, loadWaitingList, clearLog, logout
    });

    init();
</script>
</body>
</html>
